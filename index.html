<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#15120f">
<title>용사 박멸 주식회사 v0.6.1</title>
<link rel="stylesheet" href="app.css?v=0610">
</head>
<body>
<section id="authGate" class="auth-gate">
  <div class="auth-card">
    <div class="auth-logo">HERO EXTERMINATION INC.</div>
    <h1>용사 박멸 주식회사</h1>
    <p>몬스터를 영입하고 인간 지역으로 파견하세요.<br>로그아웃해도 서버 사냥은 계속됩니다.</p>
    <div class="auth-tabs">
      <button class="active" data-auth-tab="login">로그인</button>
      <button data-auth-tab="signup">회원가입</button>
    </div>
    <form id="loginForm" class="auth-form">
      <label>아이디<input id="loginId" autocomplete="username" maxlength="20" placeholder="3~20자 영문/숫자/_" required></label>
      <label>비밀번호<input id="loginPw" type="password" autocomplete="current-password" minlength="8" maxlength="72" placeholder="8자 이상" required></label>
      <button class="btn gold auth-submit" type="submit">회사 출근</button>
    </form>
    <form id="signupForm" class="auth-form hidden">
      <label>아이디<input id="signupId" autocomplete="username" maxlength="20" placeholder="3~20자 영문/숫자/_" required></label>
      <label>비밀번호<input id="signupPw" type="password" autocomplete="new-password" minlength="8" maxlength="72" placeholder="8자 이상" required></label>
      <label>비밀번호 확인<input id="signupPw2" type="password" autocomplete="new-password" minlength="8" maxlength="72" placeholder="한 번 더 입력" required></label>
      <button class="btn gold auth-submit" type="submit">회사 설립</button>
    </form>
    <div id="authMsg" class="auth-msg"></div>
    <div class="auth-note">계정별 진행상황은 서버에 저장됩니다.</div>
  </div>
</section>
<div id="app" class="hidden">
<header class="top">
  <div class="brand"><small>용사 박멸 주식회사 · SERVER LIVE v0.6.1</small><b>몬스터 파견 본부</b><div id="serverState" class="server">서버 연결 중...</div></div>
  <div class="account-box"><span id="accountName">-</span><button class="mini-btn" data-action="logout">로그아웃</button></div>
  <div class="res"><div><span>자금</span><b id="gold">0</b></div><div><span>악명</span><b id="fame">0</b></div></div>
</header>
<main id="view"></main>
<nav class="nav" id="nav"><button data-screen="home" class="active">본사</button><button data-screen="monsters">몬스터</button><button data-screen="hunt">박멸 작전</button><button data-screen="loot">전리품</button><button data-screen="facility">시설</button></nav>
</div>
<div id="modal" class="modal hidden"></div><div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
<script src="app.js?v=0610"></script>
</body>
</html>
