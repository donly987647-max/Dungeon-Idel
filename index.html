<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#101110">
<title>용사 박멸 주식회사 v0.7.0</title>
<link rel="stylesheet" href="app.css?v=0700">
</head>
<body>
<section id="authGate" class="auth-gate">
  <div class="auth-card">
    <div class="auth-logo">HERO EXTERMINATION INC.</div>
    <h1>용사 박멸 주식회사</h1>
    <p>몬스터를 고용하고 인간 지역으로 파견해 회사를 키우세요.</p>
    <div class="auth-tabs">
      <button class="active" data-auth-tab="login">로그인</button>
      <button data-auth-tab="signup">회원가입</button>
    </div>
    <form id="loginForm" class="auth-form">
      <label>아이디<input id="loginId" autocomplete="username" minlength="2" maxlength="12" placeholder="한글 2글자 이상" required></label>
      <label>비밀번호<input id="loginPw" type="password" inputmode="numeric" autocomplete="current-password" minlength="4" maxlength="4" pattern="[0-9]{4}" placeholder="숫자 4자리" required></label>
      <button class="auth-submit" type="submit">출근하기</button>
    </form>
    <form id="signupForm" class="auth-form hidden">
      <label>아이디<input id="signupId" autocomplete="username" minlength="2" maxlength="12" placeholder="한글 2글자 이상" required></label>
      <label>비밀번호<input id="signupPw" type="password" inputmode="numeric" autocomplete="new-password" minlength="4" maxlength="4" pattern="[0-9]{4}" placeholder="숫자 4자리" required></label>
      <label>비밀번호 확인<input id="signupPw2" type="password" inputmode="numeric" autocomplete="new-password" minlength="4" maxlength="4" pattern="[0-9]{4}" placeholder="숫자 4자리 다시 입력" required></label>
      <button class="auth-submit" type="submit">회사 설립</button>
    </form>
    <div id="authMsg" class="auth-msg"></div>
    <div class="auth-note">아이디 한글 2~12글자 · 비밀번호 숫자 4자리</div>
  </div>
</section>

<div id="app" class="hidden">
  <header class="game-header">
    <div class="header-main">
      <button class="menu-button" data-action="menu" aria-label="메뉴"><i></i><i></i><i></i></button>
      <h1 id="screenTitle">본부</h1>
      <div class="money-pill"><span class="coin-mark"></span><b id="gold">0</b></div>
    </div>
    <div class="resource-line">
      <span><i class="res-dot fame"></i><b id="fame">0</b> 악명</span>
      <span><i class="res-dot monster"></i><b id="monsterCount">0</b> 몬스터</span>
      <span><i class="res-dot hunt"></i><b id="activeCount">0</b> 작전</span>
      <span><i class="res-dot loot"></i><b id="pendingCount">0</b> 전리품</span>
    </div>
    <div class="shortcut-bar">
      <button data-go="home"><span class="shortcut-icon office"></span><small>본부</small></button>
      <button data-action="candidates"><span class="shortcut-icon recruit"></span><small>영입</small><em id="candidateBadge" class="notify-dot hidden"></em></button>
      <button data-go="loot"><span class="shortcut-icon notice"></span><small>수령</small><em id="lootBadge" class="notify-dot hidden"></em></button>
    </div>
  </header>

  <main id="view" class="view"></main>

  <nav class="bottom-nav" id="nav">
    <button data-screen="home" class="active"><span class="nav-icon hq"></span><b>본부</b></button>
    <button data-screen="monsters"><span class="nav-icon mons"></span><b>몬스터</b></button>
    <button data-screen="hunt"><span class="nav-icon dungeon"></span><b>박멸</b></button>
    <button data-screen="loot"><span class="nav-icon chest"></span><b>전리품</b></button>
  </nav>
</div>

<div id="modal" class="modal hidden"></div>
<div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
<script src="app.js?v=0700"></script>
</body>
</html>
