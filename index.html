<body>
<section id="authGate" class="auth-gate">
  <div class="auth-card">
    <div class="auth-brand"><img src="assets/brand-seal.svg" alt=""><div><small>HERO EXTERMINATION INC.</small><h1>용사 박멸 주식회사</h1></div></div>
    <p>몬스터 직원을 고용하고 인간 지역의 박멸 계약을 수행하세요.</p>
    <div class="auth-tabs"><button class="active" data-auth-tab="login">출근</button><button data-auth-tab="signup">입사 등록</button></div>
    <form id="loginForm" class="auth-form"><label>사원명<input id="loginId" autocomplete="username" minlength="2" maxlength="12" placeholder="한글 2글자 이상" required></label><label>보안 PIN<input id="loginPw" type="password" inputmode="numeric" autocomplete="current-password" minlength="4" maxlength="4" pattern="[0-9]{4}" placeholder="숫자 4자리" required></label><button class="auth-submit" type="submit">본부 출근</button></form>
    <form id="signupForm" class="auth-form hidden"><label>사원명<input id="signupId" autocomplete="username" minlength="2" maxlength="12" placeholder="한글 2글자 이상" required></label><label>보안 PIN<input id="signupPw" type="password" inputmode="numeric" autocomplete="new-password" minlength="4" maxlength="4" pattern="[0-9]{4}" placeholder="숫자 4자리" required></label><label>PIN 확인<input id="signupPw2" type="password" inputmode="numeric" autocomplete="new-password" minlength="4" maxlength="4" pattern="[0-9]{4}" placeholder="숫자 4자리 다시 입력" required></label><button class="auth-submit" type="submit">회사 등록</button></form>
    <div id="authMsg" class="auth-msg"></div><div class="auth-note">한글 사원명 2~12글자 · PIN 숫자 4자리</div>
  </div>
</section>
<div id="app" class="hidden">
  <header class="game-header">
    <div class="corp-bar"><button class="menu-button" data-action="menu" aria-label="메뉴"><i></i><i></i><i></i></button><div class="title-stack"><small>용사 박멸 주식회사 · v0.12.8</small><h1 id="screenTitle">본부</h1></div><div class="vault"><span>금고</span><b id="gold">0</b></div></div>
    <div class="stat-rail"><span><i class="rail-icon skull"></i><b id="fame">0</b><small>악명</small></span><span><i class="rail-icon staff"></i><b id="monsterCount">0</b><small>몬스터</small></span><span><i class="rail-icon target"></i><b id="activeCount">0</b><small>작전</small></span><span><i class="rail-icon crate"></i><b id="pendingCount">0</b><small>화물</small></span></div>
    <button id="briefStrip" class="brief-strip" data-action="brief"><span class="live-dot"></span><b>상황실</b><span id="briefLine">서버 연결 중...</span><i>›</i></button>
  </header>
  <main id="view" class="view"></main>
  <nav class="bottom-nav" id="nav"><button data-screen="home" class="active"><span class="nav-pict hq"></span><b>본부</b></button><button data-screen="monsters"><span class="nav-pict staff"></span><b>몬스터</b></button><button data-screen="hunt"><span class="nav-pict target"></span><b>박멸</b></button><span class="nav-placeholder" aria-hidden="true"></span></nav>
</div>
<div id="modal" class="modal hidden"></div><div id="toast" class="toast"></div>
