name: Run Release Patch
on:
  push:
    paths:
      - 'scripts/patch_v0118_loot_flow.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply release patch
        run: python scripts/patch_v0118_loot_flow.py
      - name: Verify JavaScript
        run: node --check app.js
      - name: Verify v0.12.6 role markers
        run: |
          grep -q 'v0.12.6' index.html
          grep -q 'roleCardHtml' app.js
          grep -q 'monster-mandrake' assets/characters.svg
          grep -q 'monster-imp' assets/characters.svg
          grep -q 'monster-golem' assets/characters.svg
          grep -q 'healing_spore' supabase/migrations/20260910001500_party_roles_v0126.sql
          grep -q 'taunt_weight' supabase/migrations/20260910001500_party_roles_v0126.sql
          grep -q 'healingDone' supabase/migrations/20260910001500_party_roles_v0126.sql
      - name: Commit release
        run: |
          git config user.name "Doong"
          git config user.email "donly987647@gmail.com"
          git add app.js app.css index.html assets/characters.svg supabase/migrations/20260910001500_party_roles_v0126.sql
          git diff --cached --quiet || git commit -m "release: v0.12.6 add healer mage tank party roles"
          git push
