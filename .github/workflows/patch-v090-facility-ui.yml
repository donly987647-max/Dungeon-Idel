name: Patch v0.9.0 Facility UI
on:
  push:
    paths:
      - '.github/workflows/patch-v090-facility-ui.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply facility-first mobile UI
        run: |
          python - <<'PY'
          from pathlib import Path

          def block(src,start,end,new):
              i=src.index(start); j=src.index(end,i)
              return src[:i]+new+'\n\n'+src[j:]

          p=Path('app.js')
          s=p.read_text()

          s=block(s,'function hq(){','function monsters(){',r'''function hq(){const [rank,grade]=companyRank(),active=(S.expeditions||[]).filter(e=>e.active),pending=totalPending(),cap=capacity(),inv=(S.inventory||[]).reduce((a,x)=>a+Number(x.qty||0),0);return `
<section class="office-banner"><div><span class="office-eyebrow">HERO EXTERMINATION INC.</span><h2>${esc(S.account?.username||'사장')} 대표 본부</h2><p>${rank} · ${grade}등급</p></div><div class="office-badge"><b>${active.length}</b><small>현장</small></div></section>
<section class="facility-stack">
  <button class="facility-row dorm" data-action="dorm"><img src="assets/icon-dorm.svg" alt=""><span class="facility-copy"><b>숙소</b><small>${S.monsters.length}/${cap} 몬스터</small></span><span class="facility-side"><em>Lv.${S.player.quarters_level}</em><i>›</i></span></button>
  <button class="facility-row recruit" data-action="candidates"><img src="assets/icon-recruit.svg" alt=""><span class="facility-copy"><b>영입소</b><small>${(S.candidates||[]).length?`${(S.candidates||[]).length}명 면접 대기`:`다음 지원 ${candidateText()}`}</small></span><span class="facility-side">${(S.candidates||[]).length?'<em class="new">NEW</em>':'<em>대기</em>'}<i>›</i></span></button>
  <button class="facility-row storage" data-go="loot"><img src="assets/icon-storage.svg" alt=""><span class="facility-copy"><b>전리품 창고</b><small>${pending}개 회수 대기 · 보관 ${inv}개</small></span><span class="facility-side"><em>${pending?'확인':'정상'}</em><i>›</i></span></button>
  <button class="facility-row ops" data-go="hunt"><img src="assets/icon-ops.svg" alt=""><span class="facility-copy"><b>박멸 작전실</b><small>${active.length?`${active.length}건 진행 중`:'대기 중'}</small></span><span class="facility-side"><em>${active.length?'LIVE':'READY'}</em><i>›</i></span></button>
</section>
${active.length?`<section class="home-live"><header><b>진행 중인 작전</b><small>${active.length}건</small></header>${active.slice(0,3).map(e=>{const m=S.monsters.find(x=>x.id===e.monster_id),site=S.sites.find(x=>x.id===e.site_id);return `<button data-action="watch" data-id="${e.id}"><span class="live-pin"></span><span><b>${esc(site?.name||'작전')}</b><small>${esc(m?.name||'몬스터')} · 처치 ${fmt(e.kills)} · 화물 ${lootCount(e)}</small></span><i>관전</i></button>`}).join('')}</section>`:''}`}

function dormModal(){const cap=capacity();modal(`<div class="sheet-head lodge-head"><div><div class="section-kicker">MONSTER QUARTERS</div><h2>숙소 인원 관리</h2><p>${S.monsters.length}/${cap}명 입실 · 숙소 Lv.${S.player.quarters_level}</p></div><button class="close-btn" data-action="close">×</button></div><div class="lodge-list">${S.monsters.map(m=>{const e=activeOf(m.id);return `<button class="lodge-row" data-action="employee" data-id="${m.id}"><span class="lodge-avatar">${charSvg(monsterAsset(m.family),'lodge-sprite')}</span><span class="lodge-info"><b>${esc(m.name)}</b><small>${fam(m.family)} · ${esc(m.trait||'무특성')}</small><em class="${e?'field':''}">${e?'현장 출동':'숙소 대기'}</em></span><span class="lodge-stats"><i><small>LV</small><b>${m.level}</b></i><i><small>전투</small><b>${fmt(power(m))}</b></i><i><small>재능</small><b>${fmt(m.talent)}</b></i></span></button>`}).join('')}</div><div class="lodge-footer"><span><small>다음 정원</small><b>${cap} → ${cap+2}명</b></span><button class="primary-btn" data-action="upgrade" data-id="quarters">숙소 확장 · ${fmt(nextQuarterCost())}G</button></div>`,`lodge-sheet`)}''')

          s=block(s,'function monsters(){','function hunt(){',r'''function monsters(){return `
<div class="page-head"><div><span>MONSTER PERSONNEL</span><h2>몬스터 인사부</h2></div><button class="primary-btn" data-action="candidates">영입 ${(S.candidates||[]).length}</button></div>
<section class="personnel-list">${S.monsters.map(m=>{const e=activeOf(m.id);return `<button class="personnel-row ${e?'deployed':''}" data-action="employee" data-id="${m.id}"><span class="personnel-avatar">${charSvg(monsterAsset(m.family),'employee-sprite')}</span><span class="personnel-info"><b>${esc(m.name)}</b><small>${fam(m.family)} · ${esc(m.trait||'무특성')}</small><em>${e?'현장 출동':'본부 대기'}</em></span><span class="personnel-power"><small>전투력</small><b>${fmt(power(m))}</b><i>LV.${m.level}</i></span></button>`}).join('')}</section>`}''')

          s=s.replace("$('#screenTitle').textContent=({home:'본부',monsters:'직원',hunt:'박멸',loot:'창고'}[screen]||'본부');","$('#screenTitle').textContent=({home:'본부',monsters:'몬스터',hunt:'작전',loot:'창고'}[screen]||'본부');")
          s=s.replace("if(a==='candidates'){candidateModal();return}","if(a==='candidates'){candidateModal();return}if(a==='dorm'){dormModal();return}")
          s=s.replace('<h2>몬스터 지원자</h2>','<h2>영입 대기실</h2>')
          s=s.replace('지원자는 서버 시간 기준 약 4시간마다 도착합니다.','4시간마다 새로운 몬스터가 지원합니다.')
          p.write_text(s)

          h=Path('index.html'); t=h.read_text()
          t=t.replace('v0.8.2','v0.9.0').replace('0820','0900')
          t=t.replace('<span class="nav-pict staff"></span><b>직원</b>','<span class="nav-pict staff"></span><b>몬스터</b>')
          h.write_text(t)

          css=Path('app.css'); c=css.read_text()
          addon=r'''
/* v0.9.0 facility-first UI — Guild Master information hierarchy, original company theme */
.office-banner{min-height:122px;border:1px solid #59625a;background:linear-gradient(90deg,#111511ef,#1115118f),url('assets/hq-scene.svg') center/cover no-repeat;display:flex;align-items:flex-end;justify-content:space-between;padding:18px 16px;position:relative;overflow:hidden}.office-banner:after{content:"";position:absolute;inset:0;border-top:3px solid #a9673c;pointer-events:none}.office-banner>div{position:relative;z-index:1}.office-eyebrow{display:block;color:#c7794c;font-size:8px;font-weight:900;letter-spacing:.9px}.office-banner h2{margin:3px 0 2px;font-size:22px;line-height:1.15}.office-banner p{margin:0;color:#a3aba4;font-size:9px}.office-badge{width:54px;height:54px;border:1px solid #7a5a42;background:#15110eeb;display:grid;place-items:center;align-content:center}.office-badge b{font-size:20px;color:#e59a61}.office-badge small{font-size:8px;color:#99765d}
.facility-stack{display:grid;gap:9px}.facility-row{width:100%;min-height:86px;border:1px solid #5d655e;background:#292e2a;color:#eef1eb;display:grid;grid-template-columns:64px minmax(0,1fr) auto;align-items:center;gap:12px;padding:9px 12px;text-align:left;position:relative;overflow:hidden}.facility-row:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:#6b756c}.facility-row.dorm:before{background:#a86c46}.facility-row.recruit:before{background:#877452}.facility-row.storage:before{background:#6f7771}.facility-row.ops:before{background:#9d4f47}.facility-row img{width:54px;height:54px;image-rendering:pixelated;object-fit:contain}.facility-copy{min-width:0}.facility-copy b{display:block;font-size:19px;line-height:1.1}.facility-copy small{display:block;margin-top:5px;color:#b1b7b1;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.facility-side{display:flex;align-items:center;gap:10px;white-space:nowrap}.facility-side em{font-style:normal;color:#b7bdb8;font-size:10px}.facility-side em.new{color:#f5a256;font-weight:900}.facility-side i{font-style:normal;font-size:24px;color:#8d948e}.facility-row:active{transform:translateY(1px);background:#323833;border-color:#8a938b}
.home-live{border:1px solid #434a44;background:#161a17}.home-live header{height:37px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;border-bottom:1px solid #343a35;background:#222723}.home-live header b{font-size:12px}.home-live header small{font-size:9px;color:#8d958f}.home-live>button{width:100%;height:54px;border:0;border-bottom:1px solid #303630;background:transparent;color:inherit;display:grid;grid-template-columns:7px 1fr auto;align-items:center;gap:9px;padding:7px 10px;text-align:left}.home-live>button:last-child{border-bottom:0}.home-live .live-pin{height:32px;background:#a65449}.home-live span span{min-width:0}.home-live button b{font-size:12px;display:block}.home-live button small{display:block;margin-top:2px;color:#8e978f;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.home-live button i{font-style:normal;color:#d28a58;font-size:10px}
.page-head{display:flex;align-items:end;justify-content:space-between;gap:10px;padding:2px 1px 4px}.page-head>div{min-width:0}.page-head span{display:block;color:#8f6250;font-size:8px;font-weight:900;letter-spacing:.8px}.page-head h2{font-size:23px;margin:2px 0 0}.personnel-list{display:grid;gap:7px}.personnel-row{width:100%;min-height:86px;border:1px solid #59615a;background:#2a2f2b;color:inherit;display:grid;grid-template-columns:64px minmax(0,1fr) 76px;align-items:center;padding:0;text-align:left;overflow:hidden}.personnel-row.deployed{border-color:#8b6650}.personnel-avatar{height:84px;border-right:1px solid #4a514b;background:#181c19;display:grid;place-items:center}.personnel-avatar .pixel-char{width:60px;height:60px}.personnel-info{padding:9px 10px;min-width:0}.personnel-info b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.personnel-info small{display:block;color:#aaaFAa;font-size:9px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.personnel-info em{display:inline-block;margin-top:7px;padding:2px 5px;border:1px solid #555e56;background:#1c211d;color:#acb3ad;font-style:normal;font-size:8px}.deployed .personnel-info em{border-color:#81564a;color:#d58a70}.personnel-power{height:100%;border-left:1px solid #464d47;display:grid;place-items:center;align-content:center;text-align:center;background:#202521}.personnel-power small{font-size:7px;color:#888f89}.personnel-power b{font-size:15px;color:#efb06c;margin:2px 0}.personnel-power i{font-size:8px;color:#aeb4af;font-style:normal}
.lodge-sheet{max-height:94vh;padding-bottom:calc(10px + env(safe-area-inset-bottom))}.lodge-head{padding-bottom:3px}.lodge-list{display:grid;gap:6px}.lodge-row{width:100%;min-height:78px;border:1px solid #515951;background:#292e2a;color:inherit;display:grid;grid-template-columns:60px minmax(0,1fr) 132px;align-items:center;padding:0;text-align:left}.lodge-avatar{height:76px;background:#171b18;border-right:1px solid #424a43;display:grid;place-items:center}.lodge-avatar .pixel-char{width:56px;height:56px}.lodge-info{min-width:0;padding:8px 9px}.lodge-info b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lodge-info small{display:block;margin-top:2px;color:#9da59e;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lodge-info em{display:inline-block;margin-top:5px;font-style:normal;font-size:8px;color:#aab1ab}.lodge-info em.field{color:#df8a67}.lodge-stats{height:100%;display:grid;grid-template-columns:repeat(3,1fr);border-left:1px solid #454c46}.lodge-stats i{display:grid;place-items:center;align-content:center;border-right:1px solid #414842;font-style:normal;text-align:center}.lodge-stats i:last-child{border-right:0}.lodge-stats small{font-size:7px;color:#777f79}.lodge-stats b{font-size:11px;color:#e7eae5;margin-top:2px}.lodge-footer{position:sticky;bottom:0;margin:10px -2px -2px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px;background:#171b18f4;border:1px solid #4b534c;box-shadow:0 -8px 20px #0008}.lodge-footer span small{display:block;color:#828a84;font-size:8px}.lodge-footer span b{font-size:13px}.lodge-footer button{white-space:nowrap}
/* simplify legacy chrome */
.game-header .brief-strip{display:none}.game-header{box-shadow:0 3px 0 #080a08}.view{gap:10px;padding-top:10px}.stat-rail{height:42px}.corp-bar{height:64px}.title-stack small{display:none}.title-stack h1{font-size:21px}.vault{min-width:94px}.vault span{display:none}.vault b{font-size:16px}.bottom-nav b{font-size:10px}
@media(max-width:430px){.facility-row{min-height:78px;grid-template-columns:56px minmax(0,1fr) auto;gap:9px;padding:8px 9px}.facility-row img{width:48px;height:48px}.facility-copy b{font-size:17px}.facility-copy small{font-size:10px}.facility-side{gap:5px}.facility-side i{font-size:20px}.office-banner{min-height:110px;padding:15px 13px}.office-banner h2{font-size:20px}.personnel-row{grid-template-columns:58px minmax(0,1fr) 68px}.personnel-avatar{height:78px}.personnel-avatar .pixel-char{width:54px;height:54px}.lodge-row{grid-template-columns:54px minmax(0,1fr) 105px}.lodge-avatar{height:72px}.lodge-avatar .pixel-char{width:50px;height:50px}.lodge-stats b{font-size:10px}.lodge-stats small{font-size:6px}.lodge-footer{grid-template-columns:1fr}.lodge-footer button{width:100%}}
@media(max-width:360px){.facility-side em{display:none}.lodge-row{grid-template-columns:52px minmax(0,1fr) 82px}.lodge-stats i:nth-child(3){display:none}.lodge-stats{grid-template-columns:1fr 1fr}.personnel-power{width:62px}.personnel-row{grid-template-columns:54px minmax(0,1fr) 62px}}
'''
          if 'v0.9.0 facility-first UI' not in c: c += addon
          css.write_text(c)
          PY
      - name: Verify source
        run: |
          node --check app.js
          grep -q 'v0.9.0' index.html
          grep -q 'data-action="dorm"' app.js
          grep -q 'function dormModal' app.js
          grep -q 'facility-first UI' app.css
      - name: Commit
        run: |
          git config user.name 'Doong'
          git config user.email 'donly987647@gmail.com'
          git add index.html app.js app.css
          git commit -m 'Redesign v0.9.0 facility-first Guild Master inspired UI'
          git push
