name: Run v0.12.0 Evolution Patch
on:
  push:
    paths:
      - 'scripts/patch_v0120_evolution.py'
      - '.github/workflows/run-patch-v0120-evolution.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v0.12.0 evolution patch
        run: python scripts/patch_v0120_evolution.py
      - name: Verify JavaScript
        run: node --check app.js
      - name: Verify evolution markers
        run: |
          grep -q "function evolutionModal" app.js
          grep -q "무료 영입" app.js
          grep -q "v0.12.0" index.html
          grep -q "unique-skill-card" app.css
      - name: Commit release files
        run: |
          git config user.name "Doong"
          git config user.email "donly987647@gmail.com"
          git add app.js app.css index.html
          git diff --cached --quiet || git commit -m "release: v0.12.0 monster evolution and unique skills"
          git push
