name: One-time v0.13.3 prebuilt deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vercel-prebuilt-v0133.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Check Vercel token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: test -n "$VERCEL_TOKEN"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Link project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel link --yes --project hero-extermination-inc --token "$VERCEL_TOKEN"

      - name: Pull production settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: Build locally
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token "$VERCEL_TOKEN"

      - name: Deploy prebuilt production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          URL=$(vercel deploy --prebuilt --prod --yes --token "$VERCEL_TOKEN")
          echo "VERCEL_PRODUCTION_URL=$URL" >> "$GITHUB_ENV"

      - name: Smoke test v0.13.3
        run: |
          curl -fsSL "$VERCEL_PRODUCTION_URL" -o /tmp/index.html
          grep -q 'v0.13.3' /tmp/index.html
          curl -fsSL "$VERCEL_PRODUCTION_URL/scripts/stability-v0133.js?v=0133a" -o /tmp/stability.js
          grep -q 'runtime stability' /tmp/stability.js
          curl -fsSL "$VERCEL_PRODUCTION_URL/ui-v0133.css?v=0133a" -o /tmp/ui.css
          grep -q 'hunt card overflow fix' /tmp/ui.css
