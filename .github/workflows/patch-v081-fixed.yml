name: Patch v0.8.1 Assets and UX Fixed
on:
  push:
    paths:
      - '.github/workflows/patch-v081-fixed.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrate original sprites and UX
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.js'); s=p.read_text()
          helpers=r'''const monsterAsset=f=>`monster-${f==='goblin'?'goblin':f==='troll'?'troll':'slime'}`;
          const enemyAsset=n=>{const x=String(n||'');if(/나무꾼|농부|짐꾼/.test(x))return 'human-lumberjack';if(/사냥꾼|석궁|호위/.test(x))return 'human-hunter';if(/대장|기사|경비|병사/.test(x))return 'human-captain';return 'human-youth'};
          const itemAsset=n=>{const x=String(n||'');if(/동전/.test(x))return 'coin';if(/천/.test(x))return 'cloth';if(/몽둥이/.test(x))return 'club';if(/주머니/.test(x))return 'pouch';if(/가죽/.test(x))return 'leather';if(/낫/.test(x))return 'sickle';if(/철/.test(x))return 'iron';if(/검/.test(x))return 'sword';return 'crate'};
          const charSvg=(id,cls='')=>`<svg class="pixel-char ${cls}" viewBox="0 0 64 64" aria-hidden="true"><use href="assets/characters.svg#${id}"></use></svg>`;
          const itemSvg=(id,cls='')=>`<svg class="pixel-item ${cls}" viewBox="0 0 48 48" aria-hidden="true"><use href="assets/items.svg#${id}"></use></svg>`;
          const buzz=()=>{try{navigator.vibrate?.(12)}catch(_){}};
          '''
          anchor="const validPin=p=>/^\\d{4}$/.test(String(p||''));\n"
          if 'const monsterAsset=' not in s:s=s.replace(anchor,anchor+helpers)
          def block(src,start,end,new):
              i=src.index(start); j=src.index(end,i); return src[:i]+new+'\n\n'+src[j:]
          s=block(s,'function monsters(){','function hunt(){',r'''function monsters(){return `
          <div class="roster-head"><div><div class="section-kicker">PERSONNEL FILE</div><div class="section-title"><h2>몬스터 직원</h2></div><div class="count">재직 ${S.monsters.length}명 · 정원 ${capacity()}명 · 다음 면접 ${candidateText()}</div></div><button data-action="candidates">지원자 ${(S.candidates||[]).length}</button></div>
          <section class="employee-list">${S.monsters.map(m=>{const e=activeOf(m.id),need=Math.max(100,m.level*100),pct=Math.min(100,Math.round((m.xp/need)*100));return `<article class="employee-card ${e?'onmission':''}" data-action="employee" data-id="${m.id}"><div class="portrait-wrap"><div class="employee-portrait">${charSvg(monsterAsset(m.family),'employee-sprite')}</div><span class="emp-level">LV.${m.level}</span><i class="family-mark ${m.family}"></i></div><div class="emp-body"><div class="emp-top"><div class="emp-name"><b>${esc(m.name)}</b><small>${fam(m.family)} · ${roleOf(m)} · ${esc(m.trait||'무특성')}</small></div><span class="duty ${e?'active':''}">${e?'현장근무':'본부대기'}</span></div><div class="xpbar"><i style="width:${pct}%"></i></div><div class="emp-stats"><span><small>전투력</small><b>${fmt(power(m))}</b></span><span><small>재능</small><b>${fmt(m.talent)}</b></span><span><small>누적 처치</small><b>${fmt(m.kills)}</b></span></div></div><span class="row-chevron">›</span></article>`}).join('')}</section>`}''')
          s=block(s,'function hunt(){','function loot(){',r'''function hunt(){const active=(S.expeditions||[]).filter(e=>e.active);return `
          <div class="mission-topline"><div><div class="section-kicker">FIELD OPERATIONS</div><div class="section-title"><h2>박멸 계약</h2></div><p>계약서를 눌러 배치·관전·철수를 한곳에서 처리합니다.</p></div><span class="tag ${active.length?'live':''}">${active.length} ACTIVE</span></div>
          <section class="mission-list">${S.sites.map(site=>{const ex=activeAt(site.id),unlocked=!!site.unlocked,pending=ex.reduce((a,e)=>a+lootCount(e),0),battle=ex.reduce((a,e)=>a+Number(e.battle_count||0),0),pct=ex.length?Math.min(94,18+(battle%78)):0;return `<article class="mission-card ${unlocked?'':'locked'}" data-action="mission" data-id="${site.id}" data-site="${site.id}"><div class="mission-art"></div><div class="mission-wash"></div><div class="mission-file"><header><div><div class="mission-code">${siteCode(site.id)} · ${unlocked?'계약 승인':'보안 잠금'}</div><div class="mission-title">${esc(site.name)}</div></div><span class="risk">권장 ${fmt(site.recommended_power)}</span></header><div class="mission-middle"><div class="squad">${ex.length?ex.slice(0,3).map(e=>{const mm=S.monsters.find(x=>x.id===e.monster_id);return `<span class="party-avatar">${mm?charSvg(monsterAsset(mm.family),'party-sprite'):''}</span>`}).join(''):'<span class="empty-slot">+</span>'}</div><div class="mission-side-note"><b>${ex.length?`${ex.length}명 현장 투입`:'투입 인원 없음'}</b><small>${esc(site.description||'인간 활동 지역')}</small></div></div><footer class="mission-foot"><div><div class="op-state">${ex.length?`<strong>${battle}회 교전</strong> · 화물 ${pending}개`:(unlocked?'즉시 배치 가능':'직원 레벨이 더 필요합니다')}</div><div class="opbar"><i style="width:${pct}%"></i></div></div><div class="mission-cta"><small>${ex.length?'LIVE':'READY'}</small><b>${unlocked?(ex.length?'현장 보기':'배치하기'):'잠김'}</b></div></footer></div></article>`}).join('')}</section>`}''')
          s=block(s,'function loot(){','function updateChrome(){',r'''function loot(){const groups=(S.expeditions||[]).filter(e=>lootCount(e)>0),total=totalPending();return `
          <section class="warehouse-head"><div><div class="section-kicker">LOGISTICS</div><h2>전리품 창고</h2><small>현장 화물은 직접 수령해야 회사 재고가 됩니다.</small></div><button class="primary-btn" data-action="collect-all" ${total?'':'disabled'}>전체 ${total}개 수령</button></section>
          ${groups.length?groups.map(e=>{const m=S.monsters.find(x=>x.id===e.monster_id),site=S.sites.find(x=>x.id===e.site_id);return `<section class="warehouse-group"><header><span><b>${esc(site?.name||'현장')} 화물</b><small>${esc(m?.name||'직원')} 담당 · ${lootCount(e)}개</small></span><button class="soft-btn" data-action="collect-one" data-id="${e.id}">수령</button></header><div class="shelf">${Object.entries(e.pending_loot||{}).map(([name,qty])=>`<div class="item-bin"><div class="item-art">${itemSvg(itemAsset(name))}</div><b>${esc(name)}</b><small>현장 전리품</small><strong>${fmt(qty)}</strong></div>`).join('')}</div></section>`}).join(''):`<div class="empty-state warehouse-empty"><div>${itemSvg('crate')}</div><b>회수 대기 화물 없음</b><span>몬스터 직원을 현장에 보내면 이곳에 전리품이 쌓입니다.</span></div>`}
          <section class="inventory-card"><h3>회사 보관 재고</h3><div class="inventory-grid">${(S.inventory||[]).length?S.inventory.map(x=>`<div class="inventory-slot"><div class="item-art small">${itemSvg(itemAsset(x.item_id))}</div><b>${esc(x.item_id)}</b><small>${fmt(x.qty)}개</small></div>`).join(''):'<div class="empty-state" style="grid-column:1/-1">보관 중인 재고가 없습니다.</div>'}</div></section>`}''')
          s=block(s,'function paintCanvases(){','function updateCandidateTimer(){',r'''function paintCanvases(){syncWatchPanel()}''')
          s=block(s,'function candidateModal(){','function employeeModal(id){',r'''function candidateModal(){modal(`<div class="sheet-head"><div><div class="section-kicker">RECRUITING</div><h2>몬스터 지원자</h2><p>지원자는 서버 시간 기준 약 4시간마다 도착합니다.</p></div><button class="close-btn" data-action="close">×</button></div><div class="candidate-list">${(S.candidates||[]).length?S.candidates.map(c=>{const cost=90+Math.floor(c.talent*1.7);return `<div class="candidate-card"><div class="candidate-avatar">${charSvg(monsterAsset(c.family),'candidate-sprite')}</div><div><b>${esc(c.name)} · ${fam(c.family)}</b><small>재능 ${c.talent} · ${esc(c.trait)} · 기본 전투력 ${c.power_base}</small><span class="candidate-fit">${c.talent>=95?'특급 인재':c.talent>=88?'우수 인재':'일반 지원자'}</span></div><div class="actions"><button class="primary-btn" data-action="hire" data-id="${c.id}">${cost}G 채용</button><button class="soft-btn" data-action="reject" data-id="${c.id}">거절</button></div></div>`}).join(''):'<div class="empty-state">현재 대기 중인 지원자가 없습니다.<br>다음 도착까지 ${candidateText()}</div>'}</div>`)}''')
          s=block(s,'function employeeModal(id){','function missionModal(siteId){',r'''function employeeModal(id){const m=S.monsters.find(x=>x.id===id);if(!m)return;const e=activeOf(m.id),site=e&&S.sites.find(x=>x.id===e.site_id);modal(`<div class="sheet-head"><div><div class="section-kicker">EMPLOYEE RECORD</div><h2>${esc(m.name)} 인사기록</h2><p>${fam(m.family)} · ${roleOf(m)}</p></div><button class="close-btn" data-action="close">×</button></div><div class="monster-detail"><div class="detail-portrait">${charSvg(monsterAsset(m.family),'detail-sprite')}</div><div class="detail-stats"><div><small>레벨</small><b>LV.${m.level}</b></div><div><small>전투력</small><b>${fmt(power(m))}</b></div><div><small>재능</small><b>${fmt(m.talent)}</b></div><div><small>누적 처치</small><b>${fmt(m.kills)}</b></div></div><div class="detail-note"><b>${esc(m.trait||'무특성')}</b><br>${e?`${esc(site?.name||'현장')}에서 현재 근무 중입니다. 전투와 경험치 획득은 서버에서 계속 처리됩니다.`:'현재 본부 대기 중입니다. 박멸 계약 화면에서 현장에 배치할 수 있습니다.'}</div></div>${e?`<div class="battle-actions"><button class="primary-btn" data-action="watch" data-id="${e.id}">현장 관전</button></div>`:''}`)}''')
          s=block(s,'function missionModal(siteId){','function watchModal(expId){',r'''function missionModal(siteId){const site=S.sites.find(x=>x.id===siteId);if(!site)return;if(!site.unlocked){toast('아직 계약 권한이 없습니다.');return}const ex=activeAt(site.id);modal(`<div class="sheet-head"><div><div class="section-kicker">${siteCode(site.id)}</div><h2>${esc(site.name)}</h2><p>권장 전투력 ${fmt(site.recommended_power)} · ${esc(site.description||'인간 활동 지역')}</p></div><button class="close-btn" data-action="close">×</button></div>${ex.length?`<div class="brief-list">${ex.map(e=>{const m=S.monsters.find(x=>x.id===e.monster_id);return `<div class="brief-item mission-live-row"><span class="mini-avatar">${m?charSvg(monsterAsset(m.family)):''}</span><div><b>${esc(m?.name||'직원')} 현장 투입 중</b><small>전투 ${fmt(e.battle_count)}회 · 처치 ${fmt(e.kills)} · 화물 ${lootCount(e)}개</small><div class="battle-actions"><button class="primary-btn" data-action="watch" data-id="${e.id}">관전</button><button class="danger-btn" data-action="recall" data-id="${e.id}">복귀</button></div></div></div>`}).join('')}</div><div class="section-title" style="margin-top:12px"><h2 style="font-size:14px">추가 투입</h2><small>대기 직원을 배치할 수 있습니다.</small></div>`:''}<div class="dispatch-list">${S.monsters.map(m=>{const a=activeOf(m.id);return `<div class="dispatch-row"><div class="dispatch-avatar">${charSvg(monsterAsset(m.family),'dispatch-sprite')}</div><div><b>${esc(m.name)} · LV.${m.level}</b><small>전투력 ${fmt(power(m))}${a?' · 다른 현장 근무 중':''}</small></div><button class="primary-btn" data-action="deploy" data-id="${m.id}" data-site="${site.id}">${a?'재배치':'투입'}</button></div>`}).join('')}</div>`)}''')
          s=block(s,'function watchModal(expId){','function menuModal(){',r'''function watchModal(expId){const e=S.expeditions.find(x=>x.id===expId);if(!e)return;const m=S.monsters.find(x=>x.id===e.monster_id),site=S.sites.find(x=>x.id===e.site_id),enemy=e.battle_state?.enemy||site?.enemy_names?.[0]||'용사';watchingExpeditionId=expId;modal(`<div class="sheet-head"><div><div class="section-kicker">LIVE FIELD FEED</div><h2>${esc(site?.name||'현장')} 실시간 보고</h2><p>${esc(m?.name||'직원')} · 서버 자동전투 관전</p></div><button class="close-btn" data-action="close">×</button></div><div class="battle-stage ${e.site_id}"><div class="battle-bg"></div><div class="battle-actors"><div class="battle-unit monster-unit"><div class="actor-sprite">${m?charSvg(monsterAsset(m.family),'battle-sprite'):''}</div><span>${esc(m?.name||'직원')}</span></div><div class="impact-burst">×</div><div class="battle-unit enemy-unit"><div id="liveEnemySprite" class="actor-sprite">${charSvg(enemyAsset(enemy),'battle-sprite')}</div><span id="liveEnemyName">${esc(enemy)}</span></div></div></div><div class="battle-hud"><span>교전 <b id="liveBattleCount">${fmt(e.battle_count)}</b>회</span><span>처치 <b id="liveKills">${fmt(e.kills)}</b> · 화물 <b id="liveLoot">${lootCount(e)}</b>개</span></div><div id="liveLog" class="battle-log">${(e.battle_log||[]).slice(0,8).map(x=>`${new Date(x.t).toLocaleTimeString('ko-KR')} · ${esc(x.enemy)} · ${x.result==='win'?'박멸 성공':'교전 실패'}`).join('<br>')||'새로운 전투 기록을 기다리는 중...'}</div><div class="battle-actions"><button class="danger-btn" data-action="recall" data-id="${e.id}">현장 철수</button><button class="soft-btn" data-action="close">닫기</button></div>`);syncWatchPanel()}''')
          marker='async function refresh(){'
          sync=r'''function syncWatchPanel(){if(!watchingExpeditionId||!S)return;const e=S.expeditions.find(x=>x.id===watchingExpeditionId);if(!e)return;const site=S.sites.find(x=>x.id===e.site_id),enemy=e.battle_state?.enemy||site?.enemy_names?.[0]||'용사';const bc=$('#liveBattleCount'),k=$('#liveKills'),l=$('#liveLoot'),n=$('#liveEnemyName'),log=$('#liveLog'),holder=$('#liveEnemySprite');if(bc)bc.textContent=fmt(e.battle_count);if(k)k.textContent=fmt(e.kills);if(l)l.textContent=lootCount(e);if(n)n.textContent=enemy;if(holder){const u=holder.querySelector('use');if(u)u.setAttribute('href',`assets/characters.svg#${enemyAsset(enemy)}`)}if(log)log.innerHTML=(e.battle_log||[]).slice(0,8).map(x=>`${new Date(x.t).toLocaleTimeString('ko-KR')} · ${esc(x.enemy)} · ${x.result==='win'?'박멸 성공':'교전 실패'}`).join('<br>')||'새로운 전투 기록을 기다리는 중...'}
          '''
          if 'function syncWatchPanel()' not in s:s=s.replace(marker,sync+marker)
          s=s.replace("function toast(text){const e=$('#toast');", "function toast(text){buzz();const e=$('#toast');")
          s=s.replace("setInterval(()=>{if(!S)return;paintCanvases()},260);", "setInterval(syncWatchPanel,900);")
          p.write_text(s)
          h=Path('index.html'); h.write_text(h.read_text().replace('v0.8.0','v0.8.1').replace('0800','0810'))
          css=Path('app.css'); c=css.read_text(); addon=r'''
          /* v0.8.1 original sprite + UX layer */
          button{touch-action:manipulation}.pixel-char,.pixel-item{display:block;width:100%;height:100%;image-rendering:pixelated;overflow:visible}.employee-portrait{width:74px;height:74px;display:grid;place-items:center}.employee-sprite{filter:drop-shadow(0 4px 0 #050805)}.family-mark{position:absolute;right:5px;top:5px;width:8px;height:8px;border-radius:50%;box-shadow:0 0 0 2px #111}.family-mark.slime{background:#76c98a}.family-mark.goblin{background:#a7be57}.family-mark.troll{background:#839577}.row-chevron{position:absolute;right:5px;top:50%;transform:translateY(-50%);font-size:20px;color:#536057;opacity:.55}.employee-card .emp-body{padding-right:19px}.employee-card:active .employee-sprite{transform:translateY(2px)}
          .party-avatar{width:44px;height:44px;border:1px solid #8b663c;background:#0c100d;display:grid;place-items:center;overflow:hidden}.party-avatar .pixel-char{width:42px;height:42px}.mission-cta{min-width:64px;height:44px;border:1px solid #8e673d;background:#392918d9;display:grid;place-items:center;text-align:center;padding:3px 5px}.mission-cta small{font-size:7px;color:#a78d68}.mission-cta b{font-size:9px;color:#f1bd75}.mission-card:active{transform:translateY(1px);border-color:#86623c}
          .item-art{width:44px;height:44px;border:1px solid #564b3b;background:radial-gradient(circle,#242b26,#111512);display:grid;place-items:center;margin-bottom:5px}.item-art .pixel-item{width:39px;height:39px}.item-art.small{width:42px;height:42px;margin:0 auto 4px}.warehouse-empty{display:grid;justify-items:center;gap:5px}.warehouse-empty>div{width:58px;height:58px}.warehouse-empty b{color:#d9ded8}.warehouse-empty span{color:#6f7a72;font-size:8px}.inventory-slot:active{background:#171d18;border-color:#6b573c}
          .candidate-avatar,.dispatch-avatar,.detail-portrait,.mini-avatar{background:#0c100d;border:1px solid #4c594e;display:grid;place-items:center;overflow:hidden}.candidate-avatar{width:58px;height:58px}.candidate-sprite{width:54px;height:54px}.candidate-fit{display:inline-block;margin-top:4px;border:1px solid #5a684f;color:#91c57e;background:#162018;padding:2px 4px;font-size:7px}.dispatch-avatar{width:50px;height:50px}.dispatch-sprite{width:47px;height:47px}.detail-portrait{width:112px;height:112px}.detail-sprite{width:104px;height:104px}.mission-live-row{grid-template-columns:42px 1fr}.mini-avatar{width:42px;height:42px}.mini-avatar .pixel-char{width:40px;height:40px}.candidate-card{grid-template-columns:64px 1fr auto}.dispatch-row{grid-template-columns:56px 1fr auto}
          .battle-stage{height:300px}.battle-actors{position:absolute;z-index:3;inset:0;display:flex;align-items:flex-end;justify-content:space-between;padding:0 11% 22px;pointer-events:none}.battle-unit{width:108px;display:grid;justify-items:center;gap:3px;position:relative}.battle-unit span{background:#0b0e0cdd;border:1px solid #435046;padding:3px 6px;color:#e9ede7;font-size:9px;white-space:nowrap}.actor-sprite{width:100px;height:100px;display:grid;place-items:center;filter:drop-shadow(0 7px 0 #0007)}.battle-sprite{width:96px;height:96px}.monster-unit{animation:monsterLunge 1.4s steps(4,end) infinite}.enemy-unit{animation:enemyRecoil 1.4s steps(4,end) infinite}.impact-burst{position:absolute;left:50%;bottom:77px;transform:translateX(-50%) scale(.7);color:#efb968;font:900 34px monospace;text-shadow:8px 0 #c85a4f,-8px 0 #c85a4f;animation:impactPop 1.4s steps(2,end) infinite}.battle-stage:before{content:"";position:absolute;z-index:2;left:8%;right:8%;bottom:21px;height:24px;background:linear-gradient(90deg,transparent,#0007 20%,#0007 80%,transparent);filter:blur(4px)}
          @keyframes monsterLunge{0%,32%,100%{transform:translateX(0)}45%,58%{transform:translateX(48px)}62%{transform:translateX(36px)}}@keyframes enemyRecoil{0%,45%,100%{transform:translateX(0)}55%,68%{transform:translateX(13px)}}@keyframes impactPop{0%,42%,72%,100%{opacity:0;transform:translateX(-50%) scale(.4)}50%,62%{opacity:1;transform:translateX(-50%) scale(1.15)}}
          .primary-btn:disabled,.soft-btn:disabled{opacity:.35;filter:grayscale(1)}button:focus-visible{outline:2px solid #efb968;outline-offset:2px}.brief-strip:active,.bottom-nav button:active{filter:brightness(1.18)}
          @media(max-width:430px){.employee-portrait{width:64px;height:64px}.candidate-card{grid-template-columns:54px 1fr}.candidate-card .actions{grid-column:1/-1;grid-template-columns:1fr 1fr}.candidate-avatar{width:50px;height:50px}.battle-actors{padding-left:6%;padding-right:6%}.battle-unit{width:90px}.actor-sprite{width:86px;height:86px}.battle-sprite{width:84px;height:84px}}
          '''
          if 'v0.8.1 original sprite + UX layer' not in c:c+=addon
          css.write_text(c)
          PY
      - name: Verify syntax
        run: |
          node --check app.js
          grep -q 'v0.8.1' index.html
          grep -q 'assets/characters.svg' app.js
          grep -q 'assets/items.svg' app.js
      - name: Commit
        run: |
          git config user.name "Doong"
          git config user.email "donly987647@gmail.com"
          git add app.js app.css index.html
          git commit -m "Upgrade frontend to v0.8.1 original sprite UX" || exit 0
          git push
