name: Frontend Syntax Check

on:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'scripts/**/*.js'
      - '.github/workflows/frontend-syntax.yml'
  pull_request:
    paths:
      - 'app.js'
      - 'scripts/**/*.js'
      - '.github/workflows/frontend-syntax.yml'

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          find scripts -type f -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check
