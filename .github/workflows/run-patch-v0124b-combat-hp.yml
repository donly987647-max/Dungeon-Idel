name: Run v0.12.4 Combat HP Hotfix
on:
  push:
    paths:
      - 'scripts/patch_v0124b_combat_hp.py'
      - '.github/workflows/run-patch-v0124b-combat-hp.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python scripts/patch_v0124b_combat_hp.py
      - run: node --check app.js
      - run: |
          grep -F "trackedHp=Object.keys(bs.partyMaxHp||{}).length>0" app.js
          grep -F "damageText=\`선공 확률 \${initiativePct}%\`" app.js
          grep -F "0124b" index.html
      - name: Commit hotfix
        run: |
          git config user.name 'Doong'
          git config user.email 'donly987647@gmail.com'
          git add app.js index.html
          git commit -m 'fix: preserve zero HP in turn combat results'
          git pull --rebase origin main
          git push
