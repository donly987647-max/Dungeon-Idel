name: Frontend Source QA
on:
  push:
    paths:
      - 'index.html'
      - '*.css'
      - '*.js'
      - 'scripts/**'
      - 'tools/**'
      - 'assets/**'
      - '.github/workflows/verify-v080.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify JavaScript syntax
        run: |
          set -euo pipefail
          node --check app.js
          find scripts -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Verify release wiring
        run: |
          set -euo pipefail
          grep -q 'ui-v01316.css' index.html
          grep -q 'scripts/readability-v01316.js' index.html
          grep -q 'scripts/navigation-v0130.js' index.html
          grep -q 'scripts/forge-v0132.js' index.html
          grep -q 'ui-v0141.css' index.html
          grep -q 'scripts/expedition-v0141.js' index.html
          ! grep -q 'scripts/deploy-watch-v01318.js' index.html
          test -f ui-v0141.css
          test -f scripts/expedition-v0141.js
          test -f tools/attrition_sim_v0141.py
          test -f assets/brand-seal.svg
          test -f assets/hq-scene.svg
          test -f assets/icon-dorm.svg
          test -f assets/icon-recruit.svg
          test -f assets/icon-storage.svg
          test -f assets/icon-ops.svg
          test -f assets/icon-forge.svg
      - name: Run expedition attrition simulation
        run: |
          set -euo pipefail
          python3 tools/attrition_sim_v0141.py
      - name: Guard against obsolete UI layers
        run: |
          set -euo pipefail
          ! grep -q 'ui-v0139.css' index.html
          ! grep -q 'v0.8.0' index.html
          echo FRONTEND_SOURCE_QA_OK=1
