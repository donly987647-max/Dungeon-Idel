name: Run v0.12.7 Specialist Roster Patch
on:
  push:
    paths:
      - 'scripts/patch_v0127_second_roles.py'
      - '.github/workflows/run-patch-v0127-second-roles.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v0.12.7 patch
        run: python scripts/patch_v0127_second_roles.py
      - name: Verify JavaScript
        run: node --check app.js
      - name: Verify roster markers
        run: |
          grep -q "pixie:'픽시'" app.js
          grep -q "wisp:'위습'" app.js
          grep -q "mimic:'미믹'" app.js
          grep -q 'monster-pixie' assets/characters.svg
          grep -q 'monster-wisp' assets/characters.svg
          grep -q 'monster-mimic' assets/characters.svg
          grep -q 'v0.12.7' index.html
          grep -q '0127a' index.html
      - name: Commit release
        run: |
          git config user.name "Doong"
          git config user.email "donly987647@gmail.com"
          git add app.js index.html assets/characters.svg
          git diff --cached --quiet || git commit -m "release: v0.12.7 add second specialist species"
          git push
