name: Run v0.11.1 Storage Slot Patch
on:
  push:
    paths:
      - 'scripts/patch_v0111_storage_slots.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply storage slot patch
        run: python scripts/patch_v0111_storage_slots.py
      - name: Verify JavaScript
        run: node --check app.js
      - name: Verify version
        run: grep -q 'v0.11.1' index.html
      - name: Commit
        run: |
          git config user.name "Doong"
          git config user.email "donly987647@gmail.com"
          git add app.js index.html
          git diff --cached --quiet || git commit -m "Count storage capacity by item type"
          git push
