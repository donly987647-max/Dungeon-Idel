name: Run v0.11.4 Batch Queue Patch
on:
  push:
    paths:
      - 'scripts/patch_v0114_batch_queues.py'
      - '.github/workflows/run-patch-v0114.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v0.11.4 patch
        run: python scripts/patch_v0114_batch_queues.py
      - name: Verify JavaScript
        run: node --check app.js
      - name: Commit changes
        run: |
          git config user.name "Doong"
          git config user.email "donly987647@gmail.com"
          git add app.js economy-v011.css index.html
          git diff --cached --quiet || git commit -m "Add v0.11.4 batch production and shop queues"
          git push
