name: Run v0.10.0 Detail Gameplay Patch
on:
  push:
    paths:
      - scripts/patch_v0100_detail.py
      - detail-v010.css
      - .github/workflows/run-patch-v0100.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v0.10.0 patch
        run: python3 scripts/patch_v0100_detail.py
      - name: Verify JS syntax and version
        run: |
          node --check app.js
          grep -q 'v0.10.0' index.html
          grep -q 'detail-v010.css' index.html
          grep -q 'monsterStats' app.js
          grep -q 'data-action="equip"' app.js
      - name: Commit
        run: |
          git config user.name "Doong"
          git config user.email "donly987647@gmail.com"
          git add app.js index.html detail-v010.css
          git diff --cached --quiet && exit 0
          git commit -m "Implement v0.10.0 monster stats equipment and exploration UI"
          git push
