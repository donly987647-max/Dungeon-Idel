name: Patch v0.13.13 Critical UX

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-v01313-critical-ux.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply direct source fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def rep(path, old, new, label):
              p=Path(path)
              s=p.read_text()
              n=s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {n}')
              p.write_text(s.replace(old,new,1))

          # 1) Blacksmith is part of the canonical HQ markup, not injected later.
          shop='''  <button class="facility-row shop" data-action="shop"><img src="assets/icon-shop.svg" alt=""><span class="facility-copy"><b>상점</b><small>판매 ${sellJobs.length}/${S.shopCapacity||5} · 총 대기열 ${S.shopCapacity||5}</small></span><span class="facility-side"><em>Lv.${S.player.shop_level||1}</em><i>›</i></span></button>\n'''
          storage='''  <button class="facility-row storage" data-action="warehouse"><img src="assets/icon-storage.svg" alt=""><span class="facility-copy"><b>전리품 창고</b><small>${fmt(inventoryTotal())}개 보관 · ${inventoryUsed()}종</small></span><span class="facility-side"><em>Lv.${S.player.storage_level||1}</em><i>›</i></span></button>'''
          forge='''  <button class="facility-row forge" data-forge-action="open"><img src="assets/icon-forge.svg" alt=""><span class="facility-copy"><b>대장간</b><small>강화석 ${fmt(inventoryQty('강화석'))}개 · 장착 장비 ${(S.equipment||[]).length}개</small></span><span class="facility-side"><em>강화</em><i>›</i></span></button>\n'''
          rep('app.js', shop+storage, shop+forge+storage, 'canonical forge row')

          # Dynamic forge row creation is no longer allowed. These scripts may update text only.
          old='''  function decorateHome(){\n    if(!S||screen!=='home')return;const stack=document.querySelector('.facility-stack');if(!stack)return;let row=stack.querySelector('.facility-row.forge');\n    if(!row){row=document.createElement('button');row.className='facility-row forge';row.dataset.forgeAction='open';row.innerHTML=`<img src="assets/icon-forge.svg" alt=""><span class="facility-copy"><b>대장간</b><small></small></span><span class="facility-side"><em>강화</em><i>›</i></span>`;const workshop=stack.querySelector('.facility-row.workshop');if(workshop)workshop.insertAdjacentElement('afterend',row);else stack.appendChild(row)}\n    const small=row.querySelector('.facility-copy small'),text=`강화석 ${fmt(stones())}개 · 장착 장비 ${(S.equipment||[]).length}개`;if(small&&small.textContent!==text)small.textContent=text;\n  }'''
          new='''  function decorateHome(){\n    if(!S||screen!=='home')return;const row=document.querySelector('.facility-row.forge');if(!row)return;\n    const small=row.querySelector('.facility-copy small'),text=`강화석 ${fmt(stones())}개 · 장착 장비 ${(S.equipment||[]).length}개`;if(small&&small.textContent!==text)small.textContent=text;\n  }'''
          rep('scripts/forge-v0132.js',old,new,'forge decorator ownership')

          old='''  function ensureForgeRow(){\n    if(!S||screen!=='home')return;const stack=document.querySelector('.facility-stack');if(!stack)return;let row=stack.querySelector('.facility-row.forge');\n    if(!row){row=document.createElement('button');row.className='facility-row forge';row.dataset.forgeAction='open';row.innerHTML='<img src="assets/icon-forge.svg" alt=""><span class="facility-copy"><b>대장간</b><small></small></span><span class="facility-side"><em>강화</em><i>›</i></span>';const workshop=stack.querySelector('.facility-row.workshop');if(workshop)workshop.insertAdjacentElement('afterend',row);else stack.appendChild(row)}\n    const stoneQty=Number((S.inventory||[]).find(x=>x.item_id==='강화석')?.qty||0),text=`강화석 ${fmt(stoneQty)}개 · 장착 장비 ${(S.equipment||[]).length}개`,small=row.querySelector('.facility-copy small');if(small&&small.textContent!==text)small.textContent=text;\n  }'''
          new='''  function ensureForgeRow(){\n    if(!S||screen!=='home')return;const row=document.querySelector('.facility-row.forge');if(!row)return;\n    const stoneQty=Number((S.inventory||[]).find(x=>x.item_id==='강화석')?.qty||0),text=`강화석 ${fmt(stoneQty)}개 · 장착 장비 ${(S.equipment||[]).length}개`,small=row.querySelector('.facility-copy small');if(small&&small.textContent!==text)small.textContent=text;\n  }'''
          rep('scripts/stability-v0133.js',old,new,'stability forge ownership')

          # 2) Economy claims: independent per-job requests + local immediate refresh.
          rep('scripts/economy-v0128.js',"(()=>{\n  const durationText=seconds=>{","(()=>{\n  const claiming=new Set();\n  const durationText=seconds=>{",'claim set')

          rep('scripts/economy-v0128.js',
              "      const now=Date.now(),start=new Date(j.started_at).getTime(),finish=new Date(j.finish_at).getTime(),ready=j.status==='ready'||finish<=now,waiting=!ready&&start>now;",
              "      const now=Date.now(),start=new Date(j.started_at).getTime(),finish=new Date(j.finish_at).getTime(),ready=j.status==='ready'||finish<=now,waiting=!ready&&start>now,working=claiming.has(String(j.id));",
              'job working state')

          rep('scripts/economy-v0128.js',
              '''      const right=ready\n        ?`<button class="primary-btn econ-claim-btn" data-econ-action="${type==='craft'?'claim-craft':'claim-sell'}" data-id="${esc(j.id)}">완료</button>`\n        :`<strong>${waiting?'대기 '+remaining(j.started_at):remaining(j.finish_at)}</strong>`;''',
              '''      const right=ready\n        ?`<button class="primary-btn econ-claim-btn" data-econ-action="${type==='craft'?'claim-craft':'claim-sell'}" data-id="${esc(j.id)}" ${working?'disabled':''}>${working?(type==='craft'?'수령 중…':'정산 중…'):'완료'}</button>`\n        :`<strong>${waiting?'대기 '+remaining(j.started_at):remaining(j.finish_at)}</strong>`;''',
              'claim button state')

          old='''  function makeReady(row){\n    if(!row||row.dataset.jobStatus==='ready')return;\n    row.dataset.jobStatus='ready';row.classList.remove('queued');row.classList.add('ready-to-claim');\n    const type=row.dataset.econType,item=row.dataset.jobItem,qty=Number(row.dataset.jobQty||1),gold=Number(row.dataset.jobGold||0),state=row.querySelector('.econ-job-state'),note=row.querySelector('.econ-job-note'),fill=row.querySelector('.craft-progress-fill'),right=row.querySelector('.econ-job-right');\n    if(state)state.textContent=type==='craft'?'제작 완료':'판매 완료';\n    if(note)note.textContent=type==='craft'?'완제품 수령 대기':`${fmt(gold)}G 정산 대기`;\n    if(fill)fill.style.width='100%';\n    if(right)right.innerHTML=`<button class="primary-btn econ-claim-btn" data-econ-action="${type==='craft'?'claim-craft':'claim-sell'}" data-id="${esc(row.dataset.jobId)}">완료</button>`;\n  }'''
          new='''  function makeReady(row){\n    if(!row)return;\n    row.dataset.jobStatus='ready';row.classList.remove('queued');row.classList.add('ready-to-claim');\n    const type=row.dataset.econType,gold=Number(row.dataset.jobGold||0),state=row.querySelector('.econ-job-state'),note=row.querySelector('.econ-job-note'),fill=row.querySelector('.craft-progress-fill'),right=row.querySelector('.econ-job-right'),working=claiming.has(String(row.dataset.jobId||''));\n    if(state)state.textContent=type==='craft'?'제작 완료':'판매 완료';\n    if(note)note.textContent=type==='craft'?'완제품 수령 대기':`${fmt(gold)}G 정산 대기`;\n    if(fill)fill.style.width='100%';\n    if(right&&!right.querySelector('.econ-claim-btn'))right.innerHTML=`<button class="primary-btn econ-claim-btn" data-econ-action="${type==='craft'?'claim-craft':'claim-sell'}" data-id="${esc(row.dataset.jobId)}" ${working?'disabled':''}>${working?(type==='craft'?'수령 중…':'정산 중…'):'완료'}</button>`;\n  }'''
          rep('scripts/economy-v0128.js',old,new,'idempotent ready rendering')

          old='''  async function claim(type,id){\n    if(busy)return;busy=true;\n    try{\n      const fn=type==='craft'?'game_claim_craft':'game_claim_sell';\n      const {data,error}=await sb.rpc(fn,{p_job:id});\n      if(error)throw error;\n      await api('state');render();\n      if(type==='craft'){workshop();toast(`${data?.itemId||'완제품'} × ${fmt(data?.quantity||0)} 수령 완료`)}\n      else{shop();toast(`${fmt(data?.gold||0)}G 정산 완료`)}\n    }catch(err){\n      const msg=String(err?.message||err||'');\n      if(msg.includes('job_not_ready'))toast('아직 작업이 완료되지 않았습니다.');\n      else if(msg.includes('job_already_claimed'))toast('이미 완료 처리된 작업입니다.');\n      else if(msg.includes('job_missing'))toast('작업 정보를 찾을 수 없습니다.');\n      else toast('완료 처리 중 오류가 발생했습니다.');\n    }finally{busy=false}\n  }'''
          new='''  function removeLocalJob(type,id){\n    const key=type==='craft'?'craftJobs':'sellJobs';\n    S[key]=[...(S?.[key]||[])].filter(j=>String(j.id)!==String(id));\n  }\n\n  function addLocalInventory(item,qty){\n    if(!item||!Number(qty))return;let row=(S.inventory||[]).find(x=>x.item_id===item);\n    if(row)row.qty=Number(row.qty||0)+Number(qty);else{S.inventory=S.inventory||[];S.inventory.push({item_id:item,qty:Number(qty)})}\n  }\n\n  async function claim(type,id){\n    const key=String(id||'');if(!key||claiming.has(key))return;claiming.add(key);\n    const row=document.querySelector(`[data-econ-job][data-job-id="${CSS.escape(key)}"]`),btn=row?.querySelector('.econ-claim-btn');\n    row?.classList.add('claiming');if(btn){btn.disabled=true;btn.textContent=type==='craft'?'수령 중…':'정산 중…'}\n    try{\n      const fn=type==='craft'?'game_claim_craft':'game_claim_sell';\n      const {data,error}=await sb.rpc(fn,{p_job:id});if(error)throw error;\n      removeLocalJob(type,id);\n      if(type==='craft'){addLocalInventory(data?.itemId,Number(data?.quantity||0));workshop();toast(`${data?.itemId||'완제품'} × ${fmt(data?.quantity||0)} 수령 완료`)}\n      else{S.player.gold=Number(S.player.gold||0)+Number(data?.gold||0);updateChrome();shop();toast(`${fmt(data?.gold||0)}G 정산 완료`)}\n      queueMicrotask(()=>window.__frontendPollNow?.());\n    }catch(err){\n      const msg=String(err?.message||err||'');\n      if(btn&&btn.isConnected){btn.disabled=false;btn.textContent='완료'}\n      row?.classList.remove('claiming');\n      if(msg.includes('job_not_ready'))toast('아직 작업이 완료되지 않았습니다.');\n      else if(msg.includes('job_already_claimed')){toast('이미 완료 처리된 작업입니다.');window.__frontendPollNow?.()}\n      else if(msg.includes('job_missing')){toast('작업 정보를 찾을 수 없습니다.');window.__frontendPollNow?.()}\n      else toast('완료 처리 중 오류가 발생했습니다.');\n    }finally{claiming.delete(key)}\n  }'''
          rep('scripts/economy-v0128.js',old,new,'fast independent claim')

          # 3) Keep raw-sale and quantity-picker art square. Generated spans must never flex-squash.
          css=Path('economy-v0128.css')
          s=css.read_text()
          marker='/* v0.13.13 — stable economy artwork and instant claim feedback */'
          if marker not in s:
              s += '''\n\n/* v0.13.13 — stable economy artwork and instant claim feedback */\n.economy-v0128-sheet .shop-item>div:first-child{width:40px;height:40px;min-width:40px;min-height:40px;display:grid;place-items:center;overflow:hidden;aspect-ratio:1/1}\n.economy-v0128-sheet .shop-item>div:first-child>.pixel-item,.economy-v0128-sheet .shop-item>div:first-child>.generated-item-gfx{width:34px!important;height:34px!important;min-width:34px!important;min-height:34px!important;max-width:34px!important;max-height:34px!important;aspect-ratio:1/1!important;flex:0 0 34px!important;background-repeat:no-repeat;image-rendering:pixelated}\n.economy-v0128-sheet .batch-hero>.pixel-item,.economy-v0128-sheet .batch-hero>.generated-item-gfx{width:42px!important;height:42px!important;min-width:42px!important;min-height:42px!important;max-width:42px!important;max-height:42px!important;aspect-ratio:1/1!important;flex:0 0 42px!important;background-repeat:no-repeat;image-rendering:pixelated}\n.economy-v0128-sheet .job-row.claiming{border-color:#826838;box-shadow:inset 3px 0 #d39b4d}\n.economy-v0128-sheet .econ-claim-btn:disabled{opacity:.72;cursor:wait;animation:none}\n@media(max-width:380px){.economy-v0128-sheet .shop-item>div:first-child{width:36px;height:36px;min-width:36px;min-height:36px}.economy-v0128-sheet .shop-item>div:first-child>.pixel-item,.economy-v0128-sheet .shop-item>div:first-child>.generated-item-gfx{width:32px!important;height:32px!important;min-width:32px!important;min-height:32px!important;flex-basis:32px!important}}\n'''
              css.write_text(s)

          # Release/cache bust only the files changed in this patch.
          p=Path('index.html');s=p.read_text()
          s=s.replace('v0.13.12','v0.13.13')
          s=s.replace('economy-v0128.css?v=0133a','economy-v0128.css?v=01313a')
          s=s.replace('scripts/stability-v0133.js?v=01312c','scripts/stability-v0133.js?v=01313a')
          s=s.replace('app.js?v=0133a','app.js?v=01313a')
          s=s.replace('scripts/economy-v0128.js?v=0133a','scripts/economy-v0128.js?v=01313a')
          s=s.replace('scripts/forge-v0132.js?v=01312c','scripts/forge-v0132.js?v=01313a')
          p.write_text(s)
          PY

          node --check app.js
          node --check scripts/economy-v0128.js
          node --check scripts/forge-v0132.js
          node --check scripts/stability-v0133.js
          grep -q 'facility-row forge' app.js
          grep -q 'const claiming=new Set' scripts/economy-v0128.js
          grep -q 'v0.13.13' index.html
          git diff --check
          git diff -- app.js scripts/economy-v0128.js scripts/forge-v0132.js scripts/stability-v0133.js economy-v0128.css index.html

          git config user.name 'Doong'
          git config user.email 'donly987647@gmail.com'
          git add app.js scripts/economy-v0128.js scripts/forge-v0132.js scripts/stability-v0133.js economy-v0128.css index.html
          git commit -m 'release: v0.13.13 restore forge and fix economy claim UX'
          git push origin HEAD:main
