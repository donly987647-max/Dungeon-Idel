name: Run v0.9.3 Compact UI Patch
on:
  push:
    paths:
      - '.github/workflows/run-patch-v093.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply label cleanup
        run: python tools/patch_v093_labels.py
      - name: Verify
        run: |
          node --check app.js
          grep -q '몬스터 리스트' app.js
          grep -q 'MONSTER ROSTER' app.js
          grep -q 'ui-v093.css' index.html
          grep -q 'v0.9.3' index.html
      - name: Commit
        run: |
          git config user.name 'Doong'
          git config user.email 'donly987647@gmail.com'
          git add app.js
          git diff --cached --quiet || git commit -m 'Refine v0.9.3 compact roster and inventory UI'
          git push
