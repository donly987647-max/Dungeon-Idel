name: Finalize Expedition v0142
on:
  push:
    branches: ['maintenance/expedition-v0142']
    paths: ['tools/finalize_v0142.py', 'tests/expedition-runtime.mjs', '.github/workflows/finalize-expedition-v0142.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Repair original source in place
        run: |
          python3 tools/finalize_v0142.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/v0131-hunt-status.js'); s=p.read_text()
          start=s.index('  function openBattleAfterDeploy('); end=s.index('  function decorate()',start)
          s=s[:start]+s[end:]
          start=s.index('    const deploy=e.target.closest('); end=s.index('    schedule();',start)
          s=s[:start]+s[end:]
          start=s.index("  const modal=document.querySelector('#modal'),view="); end=s.index('  schedule();',start)
          s=s[:start]+"  document.addEventListener('game:render',schedule);\n"+s[end:]
          s=s.replace("em.textContent=em.textContent.replace('전리품','바닥 습득')", "if(em.textContent.includes('전리품'))em.textContent=em.textContent.replace('전리품','바닥 습득')")
          p.write_text(s)
          p=Path('app.js');s=p.read_text().replace("m.classList.add('open');window.refreshExpeditionPartyUI?.()", "m.classList.add('open');window.refreshExpeditionPartyUI?.();window.refreshHuntEnhancements?.()")
          p.write_text(s)
          p=Path('index.html');s=p.read_text().replace('scripts/v0131-hunt-status.js?v=01318a','scripts/v0131-hunt-status.js?v=0142a');p.write_text(s)
          p=Path('tests/expedition-runtime.mjs');s=p.read_text().replace('}finally{await browser.close()}', "}catch(err){await page.screenshot({path:`${output}/failure.png`,fullPage:true});await fs.writeFile(`${output}/failure.json`,JSON.stringify({error:String(err),errors,html:await page.locator('#modal').innerHTML(),state:await page.evaluate(()=>S)},null,2));throw err}finally{await browser.close()}");p.write_text(s)
          PY
      - name: Syntax and simulation
        run: |
          set -euo pipefail
          node --check app.js
          find scripts -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          python3 tools/attrition_sim_v0141.py
          ! grep -q 'Warning: truncated output' app.js
      - name: Install pinned browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0 >/tmp/pw-install.log 2>&1
          npx playwright install --with-deps chromium >>/tmp/pw-install.log 2>&1 || { tail -n 60 /tmp/pw-install.log; exit 1; }
      - name: Exercise application with synthetic server fixtures
        run: |
          set -euo pipefail
          python3 -m http.server 8123 --bind 127.0.0.1 >/tmp/game-server.log 2>&1 &
          node tests/expedition-runtime.mjs
      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expedition-v0142-browser
          path: artifacts/runtime-v0142
          retention-days: 7
      - name: Commit verified source to maintenance branch only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js scripts/stability-v0133.js scripts/v0131-hunt-status.js index.html ui-v0141.css tests/expedition-runtime.mjs
          git commit -m 'fix: finalize v0.14.2 verified expedition runtime'
          git push origin HEAD:maintenance/expedition-v0142
          echo VERIFIED_COMMIT=$(git rev-parse HEAD)
