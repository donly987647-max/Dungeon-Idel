name: Run v0.10.1 Personality UI Patch
on:
  push:
    paths:
      - 'scripts/patch_v0101_personality.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply personality UI patch
        run: python scripts/patch_v0101_personality.py
      - name: Verify JavaScript
        run: node --check app.js
      - name: Commit
        run: |
          git config user.name "Doong"
          git config user.email "donly987647@gmail.com"
          git add app.js index.html detail-v0101.css
          git diff --cached --quiet || git commit -m "Implement v0.10.1 interactive personality effects"
          git push
