name: Expedition Finalization
on:
  push:
    branches: ['fix/expedition-finalize-0142']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package exact source for isolated verification
        run: git archive --format=zip -o /tmp/dungeon-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: dungeon-source
          path: /tmp/dungeon-source.zip
          retention-days: 3
      - name: Check JavaScript
        run: |
          node --check app.js
          find scripts -name '*.js' -print0 | xargs -0 -n1 node --check
