name: Run v0.12.4 Turn Combat Patch
on:
  push:
    paths:
      - 'scripts/patch_v0124_turn_combat.py'
      - '.github/workflows/run-patch-v0124-turn-combat.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v0.12.4 combat patch
        run: python scripts/patch_v0124_turn_combat.py
      - name: Verify frontend JavaScript
        run: node --check app.js
      - name: Verify combat markers
        run: |
          grep -F "function battleViewModel" app.js
          grep -F "2초마다 수색·이동·전리품 회수·조우 또는 전투 턴" app.js
          grep -F "현재 레벨 XP -" app.js
          grep -F "setInterval(refresh,2000);" app.js
          grep -F "행동 주기" app.js
          grep -F "v0.12.4" index.html
      - name: Commit release files
        run: |
          git config user.name 'Doong'
          git config user.email 'donly987647@gmail.com'
          git add app.js app.css index.html
          git commit -m 'release: v0.12.4 persistent two-second turn combat'
          git push
