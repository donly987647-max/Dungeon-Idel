name: Run v0.11.6 Queue Scroll Patch
on:
  push:
    paths:
      - 'scripts/patch_v0116_queue_and_scroll.py'
      - '.github/workflows/run-patch-v0116.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python scripts/patch_v0116_queue_and_scroll.py
      - name: Verify
        run: |
          node --check app.js
          grep -q 'S.craftCapacity||5' app.js
          grep -q 'S.shopCapacity||5' app.js
          grep -q '총 대기열' app.js
          grep -q 'v.scrollTop=0' app.js
      - name: Commit changes
        run: |
          git config user.name "Doong"
          git config user.email "donly987647@gmail.com"
          git add app.js
          git diff --cached --quiet || git commit -m "Finalize v0.11.6 queue and scroll behavior"
          git push
