name: Run v0.11.2 Polish Patch
on:
  push:
    paths:
      - 'scripts/patch_v0112_polish.py'
      - 'scripts/run_v0112_polish.py'
      - '.github/workflows/run-patch-v0112.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v0.11.2 app patch
        run: python scripts/run_v0112_polish.py
      - name: Verify JavaScript
        run: node --check app.js
      - name: Commit app
        run: |
          git config user.name "Doong"
          git config user.email "donly987647@gmail.com"
          git add app.js
          git diff --cached --quiet || git commit -m "Add v0.11.2 motion crafting progress and raw sales"
          git push
