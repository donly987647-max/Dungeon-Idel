name: Run v0.11.5 Facility Drop Patch
on:
  push:
    paths:
      - 'scripts/patch_v0115_facilities_and_drops.py'
      - '.github/workflows/run-patch-v0115.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v0.11.5 patch
        run: python scripts/patch_v0115_facilities_and_drops.py
      - name: Verify JavaScript
        run: node --check app.js
      - name: Verify removed ops UI
        run: |
          ! grep -q 'data-id="ops"' app.js
          ! grep -q 'S.opsCapacity' app.js
          grep -q '획득 가능 아이템' app.js
          grep -q 'v0.11.5' index.html
      - name: Commit changes
        run: |
          git config user.name "Doong"
          git config user.email "donly987647@gmail.com"
          git add app.js economy-v011.css index.html
          git diff --cached --quiet || git commit -m "Build v0.11.5 facility baselines and dungeon drops"
          git push
