name: Run v0.12.5 Roster UI Patch
on:
  push:
    paths:
      - 'scripts/patch_v0125_roster_ui.py'
      - '.github/workflows/run-patch-v0125-roster-ui.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v0.12.5 roster patch
        run: python scripts/patch_v0125_roster_ui.py
      - name: Verify frontend JavaScript
        run: node --check app.js
      - name: Verify release and layout markers
        run: |
          grep -F "v0.12.5" index.html
          grep -F "candidate-card-stats" app.js
          grep -F "monster-back" app.js
          grep -F "release-confirm-open" app.js
          grep -F "if(action==='release')" supabase/functions/dungeon-idel-api/index.ts
          grep -F "released_at" supabase/functions/dungeon-idel-api/index.ts
      - name: Commit release files
        run: |
          git config user.name 'Doong'
          git config user.email 'donly987647@gmail.com'
          git add app.js app.css index.html supabase/functions/dungeon-idel-api/index.ts
          git commit -m 'release: v0.12.5 improve recruit cards and monster release'
          git push
