name: Run v0.12.3 Recruitment Patch
on:
  push:
    paths:
      - 'scripts/patch_v0123_recruitment.py'
      - '.github/workflows/run-patch-v0123-recruitment.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v0.12.3 recruitment patch
        run: python scripts/patch_v0123_recruitment.py
      - name: Verify frontend JavaScript
        run: node --check app.js
      - name: Verify recruitment markers
        run: |
          grep -F "function candidateDetailModal" app.js
          grep -F "candidate-lock" app.js
          grep -F "4시간마다" app.js
          grep -F "game_hire_candidate" supabase/functions/dungeon-idel-api/index.ts
          grep -F "game_set_candidate_lock" supabase/functions/dungeon-idel-api/index.ts
          grep -F "v0.12.3" index.html
      - name: Commit release files
        run: |
          git config user.name 'Doong'
          git config user.email 'donly987647@gmail.com'
          git add app.js app.css index.html supabase/functions/dungeon-idel-api/index.ts
          git commit -m 'fix: make recruitment atomic and refresh candidates every four hours'
          git push
